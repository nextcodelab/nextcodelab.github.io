<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Transparent Background for seamless integration -->
    <rect width="512" height="512" fill="transparent" />
    
    <!-- Top Left App Tile -->
    <rect x="64" y="64" width="160" height="160" rx="48" fill="#2563eb" />
    
    <!-- Top Right App Tile -->
    <rect x="288" y="64" width="160" height="160" rx="48" fill="#2563eb" />
    
    <!-- Bottom Left App Tile -->
    <rect x="64" y="288" width="160" height="160" rx="48" fill="#2563eb" />
    
    <!-- Bottom Right "More/Other" Tile -->
    <rect x="288" y="288" width="160" height="160" rx="44" fill="transparent" stroke="#2563eb" stroke-width="24" />
    
    <!-- The Plus Symbol indicating expansion/more -->
    <line x1="368" y1="328" x2="368" y2="408" stroke="#2563eb" stroke-width="24" stroke-linecap="round" />
    <line x1="328" y1="368" x2="408" y2="368" stroke="#2563eb" stroke-width="24" stroke-linecap="round" />
</svg>
