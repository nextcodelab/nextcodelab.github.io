<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Mode Canvas (GitHub Profile Ready) -->
  <rect width="512" height="512" fill="#0D1117" />

  <!-- Central Symbol Group -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Terminal Prompt Chevron ( Code / Input ) -->
    <path d="M 124 160 L 220 256 L 124 352" stroke="#00F0FF" stroke-width="36" />
    
    <!-- Code Separator Slash ( Lab / Experimentation ) -->
    <path d="M 252 352 L 300 160" stroke="#3B82F6" stroke-width="32" />
    
    <!-- Forward Execution Chevron ( Next / Progress ) -->
    <path d="M 316 160 L 412 256 L 316 352" stroke="#38BDF8" stroke-width="36" />
  </g>

  <!-- High-Contrast Accent Nodes -->
  <circle cx="220" cy="256" r="10" fill="#00F0FF" />
  <circle cx="412" cy="256" r="10" fill="#38BDF8" />
</svg>
