<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Blue App Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Soft Drop Shadow for Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  
  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- A4 Document (Background / Left) -->
  <g filter="url(#shadow)">
    <path d="M 88 100 
             H 256 
             L 312 156 
             V 388 
             C 312 400.15 302.15 410 290 410 
             H 88 
             C 75.85 410 66 400.15 66 388 
             V 122 
             C 66 109.85 75.85 100 88 100 Z" 
          fill="#ef4444" />
    <!-- Folded Corner Shadow/Base -->
    <path d="M 256 100 V 156 H 312 Z" fill="#b91c1c" opacity="0.6" />
    <!-- Folded Corner Highlight -->
    <path d="M 256 100 L 312 156 H 268 C 261.37 156 256 150.63 256 144 Z" fill="#fca5a5" />
    
    <!-- Text Labels inside A4 -->
    <text x="110" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" letter-spacing="1">PDF</text>
    <text x="122" y="285" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" letter-spacing="2">A4</text>
  </g>
  
  <!-- Smooth Curved Conversion Arrow -->
  <path d="M 290 190 C 340 190, 370 230, 360 275" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M 345 255 L 362 282 L 375 258" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- A5 Document (Foreground / Right) -->
  <g filter="url(#shadow)">
    <path d="M 264 230 
             H 380 
             L 426 276 
             V 422 
             C 426 431.94 417.94 440 408 440 
             H 264 
             C 254.06 440 246 431.94 246 422 
             V 248 
             C 246 238.06 254.06 230 264 230 Z" 
          fill="#dc2626" />
    <!-- Folded Corner Shadow/Base -->
    <path d="M 380 230 V 276 H 426 Z" fill="#991b1b" opacity="0.6" />
    <!-- Folded Corner Highlight -->
    <path d="M 380 230 L 426 276 H 392 C 385.37 276 380 270.63 380 264 Z" fill="#fca5a5" />
    
    <!-- Text Labels inside A5 -->
    <text x="282" y="272" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="1">PDF</text>
    <text x="290" y="375" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" letter-spacing="2">A5</text>
  </g>
</svg>
