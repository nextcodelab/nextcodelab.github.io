<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Background Gradient -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Editor Window Canvas Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Markdown Hero Badge Gradient -->
    <linearGradient id="mdBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Gloss Overlay Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <!-- Deep Drop Shadow Filter for Window -->
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Badge Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle (512x512) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#appBg)" />

  <!-- Background Ambient Glows -->
  <circle cx="256" cy="180" r="130" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle cx="160" cy="320" r="100" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />

  <!-- Main Floating Editor Window Card -->
  <rect x="72" y="88" width="368" height="336" rx="24" fill="url(#windowBg)" filter="url(#windowShadow)" />

  <!-- Window Header Bar -->
  <path d="M 72 112 A 24 24 0 0 1 96 88 L 416 88 A 24 24 0 0 1 440 112 L 440 132 L 72 132 Z" fill="#f1f5f9" />
  <line x1="72" y1="132" x2="440" y2="132" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Window Controls (Traffic Lights) -->
  <circle cx="100" cy="110" r="5" fill="#f87171" />
  <circle cx="116" cy="110" r="5" fill="#fbbf24" />
  <circle cx="132" cy="110" r="5" fill="#34d399" />

  <!-- Split Panel Center Divider Line -->
  <line x1="256" y1="132" x2="256" y2="424" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6" />

  <!-- ================= LEFT PANEL: RAW MARKDOWN SOURCE ================= -->
  <!-- Line 1: # Heading -->
  <text x="94" y="168" font-family="monospace" font-weight="bold" font-size="18" fill="#ec4899">#</text>
  <rect x="114" y="155" width="105" height="14" rx="4" fill="#1e293b" />

  <!-- Line 2: **bold** -->
  <text x="94" y="198" font-family="monospace" font-weight="bold" font-size="14" fill="#f59e0b">**</text>
  <rect x="116" y="188" width="65" height="10" rx="3" fill="#64748b" />
  <text x="185" y="198" font-family="monospace" font-weight="bold" font-size="14" fill="#f59e0b">**</text>

  <!-- Line 3: - [x] Task -->
  <text x="94" y="226" font-family="monospace" font-weight="bold" font-size="13" fill="#10b981">- [x]</text>
  <rect x="140" y="217" width="80" height="9" rx="3" fill="#64748b" />

  <!-- Line 4: Code Block Source -->
  <text x="94" y="254" font-family="monospace" font-weight="bold" font-size="13" fill="#6366f1">```js</text>
  <rect x="108" y="266" width="85" height="7" rx="3" fill="#94a3b8" />
  <rect x="108" y="279" width="55" height="7" rx="3" fill="#94a3b8" />
  <text x="94" y="302" font-family="monospace" font-weight="bold" font-size="13" fill="#6366f1">```</text>

  <!-- ================= RIGHT PANEL: RENDERED PREVIEW ================= -->
  <!-- Rendered H1 Heading -->
  <rect x="280" y="153" width="125" height="18" rx="4" fill="#2563eb" />
  <rect x="280" y="177" width="136" height="2" fill="#cbd5e1" />

  <!-- Rendered Paragraph -->
  <rect x="280" y="190" width="136" height="8" rx="3" fill="#475569" />
  <rect x="280" y="203" width="95" height="8" rx="3" fill="#64748b" />

  <!-- Rendered Task Checkbox -->
  <rect x="280" y="220" width="14" height="14" rx="4" fill="#22c55e" />
  <path d="M 283 227 L 286 230 L 291 224" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="302" y="223" width="85" height="8" rx="3" fill="#94a3b8" />

  <!-- Rendered Syntax Highlighted Code Box -->
  <rect x="280" y="246" width="136" height="64" rx="8" fill="#0f172a" />
  <!-- Code lines inside block -->
  <rect x="292" y="258" width="40" height="6" rx="3" fill="#f472b6" />
  <rect x="337" y="258" width="55" height="6" rx="3" fill="#38bdf8" />
  <rect x="292" y="272" width="85" height="6" rx="3" fill="#4ade80" />
  <rect x="292" y="286" width="50" height="6" rx="3" fill="#fbbf24" />

  <!-- Rendered Blockquote -->
  <rect x="280" y="324" width="4" height="24" rx="2" fill="#8b5cf6" />
  <rect x="292" y="327" width="115" height="6" rx="3" fill="#64748b" />
  <rect x="292" y="338" width="75" height="6" rx="3" fill="#94a3b8" />

  <!-- ================= HERO MARKDOWN EMBLEM (M↓ BADGE) ================= -->
  <g filter="url(#badgeShadow)">
    <!-- Badge Container -->
    <rect x="168" y="318" width="176" height="106" rx="22" fill="url(#mdBadgeGrad)" />
    <!-- Gloss Highlight Ring -->
    <rect x="168" y="318" width="176" height="106" rx="22" fill="url(#glossGrad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />

    <!-- Official Markdown 'M' Symbol -->
    <path d="M 194 390 V 352 L 218 378 L 242 352 V 390" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Official Markdown Down Arrow Symbol -->
    <path d="M 306 352 V 390" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M 290 374 L 306 390 L 322 374" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
