<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Dark Slate to HTML Warmth) -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e102d" />
      <stop offset="100%" stop-color="#3a1510" />
    </linearGradient>

    <!-- Canvas Card Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- HTML5 Signature Badge Gradient -->
    <linearGradient id="htmlBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="50%" stop-color="#f05323" />
      <stop offset="100%" stop-color="#d03008" />
    </linearGradient>

    <!-- Gloss Highlight Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <!-- Window Drop Shadow -->
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Hero Badge Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e0a05" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base (512x512) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#appBg)" />

  <!-- Ambient Glows -->
  <circle cx="350" cy="170" r="130" fill="#f05323" opacity="0.3" filter="url(#glow)" />
  <circle cx="160" cy="330" r="110" fill="#38bdf8" opacity="0.2" filter="url(#glow)" />

  <!-- Main Code Editor Card -->
  <rect x="72" y="88" width="368" height="336" rx="24" fill="url(#windowBg)" filter="url(#windowShadow)" />

  <!-- Window Header Bar -->
  <path d="M 72 112 A 24 24 0 0 1 96 88 L 416 88 A 24 24 0 0 1 440 112 L 440 132 L 72 132 Z" fill="#f1f5f9" />
  <line x1="72" y1="132" x2="440" y2="132" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Traffic Lights -->
  <circle cx="100" cy="110" r="5" fill="#f87171" />
  <circle cx="116" cy="110" r="5" fill="#fbbf24" />
  <circle cx="132" cy="110" r="5" fill="#34d399" />

  <!-- Tab Indicator -->
  <rect x="152" y="96" width="90" height="26" rx="6" fill="#ffffff" />
  <text x="166" y="113" font-family="sans-serif" font-weight="600" font-size="11" fill="#f05323">index.html</text>

  <!-- Split Panel Divider -->
  <line x1="256" y1="132" x2="256" y2="424" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6" />

  <!-- ================= LEFT PANEL: HTML CODE ================= -->
  <!-- <html lang="en"> -->
  <text x="92" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;</text>
  <text x="100" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">html</text>
  <text x="132" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#0284c7">lang</text>
  <text x="160" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#64748b">=</text>
  <text x="168" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#16a34a">"en"</text>
  <text x="198" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>

  <!-- <h1 class="title"> -->
  <text x="104" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;</text>
  <text x="112" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">h1</text>
  <text x="128" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#0284c7">class</text>
  <text x="164" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#64748b">=</text>
  <text x="172" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#16a34a">"..."</text>
  <text x="208" y="195" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>

  <!-- <p> paragraph -->
  <text x="104" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;</text>
  <text x="112" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">p</text>
  <text x="120" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>
  <rect x="128" y="217" width="70" height="8" rx="2" fill="#64748b" />
  <text x="202" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;/</text>
  <text x="218" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">p</text>
  <text x="226" y="225" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>

  <!-- <button> -->
  <text x="104" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;</text>
  <text x="112" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">btn</text>
  <text x="136" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>
  <rect x="144" y="247" width="50" height="8" rx="2" fill="#64748b" />
  <text x="198" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;/</text>
  <text x="214" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">b</text>
  <text x="222" y="255" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&gt;</text>

  <!-- <img src="..." /> -->
  <text x="104" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">&lt;</text>
  <text x="112" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899">img</text>
  <text x="136" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#0284c7">src</text>
  <text x="160" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#64748b">=</text>
  <text x="168" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#16a34a">"..."</text>
  <text x="204" y="285" font-family="monospace" font-weight="bold" font-size="12" fill="#f05323">/&gt;</text>

  <!-- ================= RIGHT PANEL: RENDERED PREVIEW ================= -->
  <!-- Rendered Header -->
  <rect x="280" y="153" width="125" height="18" rx="4" fill="#ea580c" />

  <!-- Rendered Paragraph lines -->
  <rect x="280" y="186" width="136" height="7" rx="3" fill="#475569" />
  <rect x="280" y="198" width="110" height="7" rx="3" fill="#64748b" />

  <!-- Rendered Button -->
  <rect x="280" y="218" width="84" height="24" rx="6" fill="#f05323" />
  <rect x="296" y="227" width="52" height="6" rx="2" fill="#ffffff" />

  <!-- Rendered Card / Media Block -->
  <rect x="280" y="254" width="136" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="304" cy="284" r="14" fill="#38bdf8" />
  <rect x="328" y="274" width="70" height="8" rx="3" fill="#64748b" />
  <rect x="328" y="287" width="45" height="6" rx="3" fill="#94a3b8" />

  <!-- ================= HERO HTML EMBLEM (</> BADGE) ================= -->
  <g filter="url(#badgeShadow)">
    <rect x="158" y="316" width="196" height="110" rx="22" fill="url(#htmlBadgeGrad)" />
    <rect x="158" y="316" width="196" height="110" rx="22" fill="url(#glossGrad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />

    <!-- Left Bracket: < -->
    <path d="M 206 352 L 182 371 L 206 390" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash: / -->
    <path d="M 244 394 L 268 348" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

    <!-- Right Bracket: > -->
    <path d="M 306 352 L 330 371 L 306 390" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
