<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextCodeLab Apps</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="apps-page">

    <!-- Header -->
    <header class="topbar">

        <div class="logo">
            NextCodeLab Apps
        </div>

        <div class="search-container">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                id="appSearch"
                placeholder="Search apps"
                autocomplete="off"
            >
        </div>

    </header>


    <!-- Apps -->
    <main class="apps-container" id="appsContainer">

        <!-- Documents -->
        <section class="category-section">

            <h2 class="category-title">
                Documents
            </h2>

            <div class="app-grid">

                <a href="notes/index.html" class="app-card">

                    <div class="app-icon">📝</div>

                    <div class="app-info">
                        <h3 class="app-title">
                            Text Notes
                        </h3>

                        <p class="app-desc">
                            Simple notes
                        </p>
                    </div>

                </a>


                <a href="pdf/index.html" class="app-card">

                    <div class="app-icon">📄</div>

                    <div class="app-info">
                        <h3 class="app-title">
                            PDF Viewer
                        </h3>

                        <p class="app-desc">
                            View PDF files
                        </p>
                    </div>

                </a>


                <a href="#" class="app-card">

                    <div class="app-icon">📑</div>

                    <div class="app-info">
                        <h3 class="app-title">
                            PDF Merge
                        </h3>

                        <p class="app-desc">
                            Merge PDF files
                        </p>
                    </div>

                </a>

            </div>

        </section>


        <!-- Calculators -->
        <section class="category-section">

            <h2 class="category-title">
                Calculators
            </h2>

            <div class="app-grid">

                <a href="calculator/index.html" class="app-card">

                    <div class="app-icon">🧮</div>

                    <div class="app-info">
                        <h3 class="app-title">
                            Calculator
                        </h3>

                        <p class="app-desc">
                            Basic calculator
                        </p>
                    </div>

                </a>


                <a href="unit-converter/index.html" class="app-card">

                    <div class="app-icon">📏</div>

                    <div class="app-info">
                        <h3 class="app-title">
                            Unit Converter
                        </h3>

                        <p class="app-desc">
                            Convert units
                        </p>
                    </div>

                </a>

            </div>

        </section>


        <!-- Developer Tools -->
        <section class="category-section">

            <h2 class="category-title">
                Developer Tools
            </h2>

            <div class="app-grid">

                <a href="json/index.html" class="app-card">

                    <div class="app-icon code-icon">
                        { }
                    </div>

                    <div class="app-info">
                        <h3 class="app-title">
                            JSON Formatter
                        </h3>

                        <p class="app-desc">
                            Format JSON
                        </p>
                    </div>

                </a>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>
<script src="/js/header.js"></script>

</body>
</html>
