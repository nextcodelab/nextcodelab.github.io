<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-9045308343519031">
    <title>Markdown Notes Studio</title>
    <link rel="apple-touch-icon" href="/assets/icon.svg">
    <link rel="apple-touch-icon" href="/assets/icon.svg">
    <!-- Styling -->
    <link rel="stylesheet" href="style.css">

    <!-- Highlight.js Theme for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9045308343519031"
        crossorigin="anonymous"></script>
    <!-- External Libraries (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar: Notes Management -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-title">Notes</h1>
                <button id="btn-new-note" class="btn btn-primary" title="Create New Note (Ctrl+M)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Note
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search notes..." aria-label="Search notes">
            </div>

            <div class="note-list" id="note-list">
                <!-- Notes rendered dynamically -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Top Header Navigation / Title Bar -->
            <header class="workspace-header">
                <div class="header-left">
                    <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle Sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <input type="text" id="note-title-input" class="note-title-input" placeholder="Note Title..."
                        aria-label="Note Title">
                </div>

                <div class="header-right">
                    <button id="btn-toggle-theme" class="btn-icon" title="Toggle Theme">🌙</button>
                    <!-- Mobile Tab Switcher -->
                    <div class="mobile-toggle-group">
                        <button id="btn-show-edit" class="btn-toggle active">Edit</button>
                        <button id="btn-show-preview" class="btn-toggle">Preview</button>
                    </div>

                    <span id="save-status" class="save-status">Saved ✓</span>

                    <button id="btn-full-preview" class="btn btn-secondary" title="Full Screen Preview (Ctrl+Shift+P)">
                        ⛶ Full Preview
                    </button>
                </div>
            </header>

            <!-- Markdown Formatting Toolbar -->
            <div class="md-toolbar" id="md-toolbar">
                <!-- Formatting -->
                <div class="toolbar-group">
                    <button data-action="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                    <button data-action="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                    <button data-action="strikethrough" title="Strikethrough"><s>S</s></button>
                    <button data-action="code-inline" title="Inline Code">&lt;&gt;</button>
                    <button data-action="highlight" title="Highlight">&lt;mark&gt;</button>
                    <button data-action="remove-format" title="Remove Formatting">🧹</button>
                </div>

                <!-- Headings Dropdown -->
                <div class="toolbar-group">
                    <select id="heading-select" title="Headings">
                        <option value="" disabled selected>Heading</option>
                        <option value="h1">H1 Heading</option>
                        <option value="h2">H2 Heading</option>
                        <option value="h3">H3 Heading</option>
                        <option value="h4">H4 Heading</option>
                        <option value="h5">H5 Heading</option>
                        <option value="h6">H6 Heading</option>
                    </select>
                </div>

                <!-- Lists -->
                <div class="toolbar-group">
                    <button data-action="list-ul" title="Unordered List">• List</button>
                    <button data-action="list-ol" title="Ordered List">1. List</button>
                    <button data-action="checklist" title="Checklist">☑ Task</button>
                </div>

                <!-- Insert Links & Media -->
                <div class="toolbar-group">
                    <button data-action="link" title="Insert Link (Ctrl+K)">🔗 Link</button>
                    <button data-action="image" title="Insert Image">🖼 Image</button>
                    <button data-action="code-block" title="Fenced Code Block">``` Code</button>
                    <button data-action="quote" title="Blockquote">” Quote</button>
                    <button data-action="table" title="Insert Table">📊 Table</button>
                    <button data-action="hr" title="Horizontal Rule">— HR</button>
                </div>

                <!-- History & Utilities -->
                <div class="toolbar-group">
                    <button data-action="undo" title="Undo (Ctrl+Z)">↶</button>
                    <button data-action="redo" title="Redo (Ctrl+Y)">↷</button>
                </div>
            </div>

            <!-- Split Editor Panel Workspace -->
            <div class="editor-container" id="editor-container">
                <!-- Source Code Area -->
                <div class="panel source-panel" id="source-panel">
                    <textarea id="markdown-input" placeholder="Type Markdown here..." spellcheck="false"></textarea>
                </div>

                <!-- Rendered Markdown Output -->
                <div class="panel preview-panel" id="preview-panel">
                    <div id="markdown-preview" class="markdown-body"></div>
                </div>
            </div>

            <!-- Bottom Status Bar -->
            <footer class="editor-footer">
                <div class="footer-stats">
                    <span>Words: <strong id="stat-words">0</strong></span>
                    <span>Characters: <strong id="stat-chars">0</strong></span>
                    <span>Lines: <strong id="stat-lines">0</strong></span>
                </div>
                <div class="footer-meta">
                    <span id="stat-modified">Last updated: -</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Fullscreen Reader Overlay -->
    <div id="full-preview-modal" class="modal-overlay hidden">
        <div class="full-preview-header">
            <button id="btn-close-full-preview" class="btn btn-secondary">← Back to Editor</button>
            <span class="full-preview-title">Reading Mode</span>
            <span></span>
        </div>
        <div class="full-preview-content">
            <div id="full-markdown-preview" class="markdown-body"></div>
        </div>
    </div>

    <!-- Dialog: Insert Link -->
    <div id="dialog-link" class="modal-dialog hidden">
        <div class="dialog-content">
            <h3>Insert Link</h3>
            <label>Link Text</label>
            <input type="text" id="link-text-input" placeholder="e.g. My Website">
            <label>URL</label>
            <input type="url" id="link-url-input" placeholder="[https://example.com](https://example.com)">
            <div class="dialog-actions">
                <button id="btn-cancel-link" class="btn btn-secondary">Cancel</button>
                <button id="btn-confirm-link" class="btn btn-primary">Insert Link</button>
            </div>
        </div>
    </div>

    <!-- Dialog: Insert Image -->
    <div id="dialog-image" class="modal-dialog hidden">
        <div class="dialog-content">
            <h3>Insert Image</h3>
            <label>Image Alt Text</label>
            <input type="text" id="image-alt-input" placeholder="e.g. Image Description">
            <label>Image URL</label>
            <input type="url" id="image-url-input"
                placeholder="[https://example.com/image.png](https://example.com/image.png)">

            <div class="file-picker-section">
                <span class="divider-text">OR choose local file</span>
                <input type="file" id="image-file-input" accept="image/*">
                <p class="field-hint">Note: Local image data is embedded as Base64. Ensure file sizes stay small to
                    conserve localStorage.</p>
            </div>

            <div class="dialog-actions">
                <button id="btn-cancel-image" class="btn btn-secondary">Cancel</button>
                <button id="btn-confirm-image" class="btn btn-primary">Insert Image</button>
            </div>
        </div>
    </div>

    <!-- Dialog: Insert Code Block -->
    <div id="dialog-code" class="modal-dialog hidden">
        <div class="dialog-content">
            <h3>Insert Code Block</h3>
            <label>Programming Language</label>
            <select id="code-lang-select">
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="python">Python</option>
                <option value="json">JSON</option>
                <option value="bash">Bash / Shell</option>
                <option value="sql">SQL</option>
                <option value="">Plain Text</option>
            </select>
            <div class="dialog-actions">
                <button id="btn-cancel-code" class="btn btn-secondary">Cancel</button>
                <button id="btn-confirm-code" class="btn btn-primary">Insert Code Block</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>

</html>
