<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Editor Studio</title>
    <!-- Replace CodeMirror CDN scripts with Monaco Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <!-- Styling -->
    <link rel="stylesheet" href="style.css">

    <!-- Security Sanitizer (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar: Notes Management -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-title">HTML Notes</h1>
                <button id="btn-new-note" class="btn btn-primary" title="Create New Document (Ctrl+M)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Document
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search documents..." aria-label="Search documents">
            </div>

            <div class="note-list" id="note-list">
                <!-- Notes rendered dynamically -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Top Header Navigation -->
            <header class="workspace-header">
                <div class="header-left">
                    <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle Sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <input type="text" id="note-title-input" class="note-title-input" placeholder="Document Title..."
                        aria-label="Document Title">
                </div>

                <div class="header-right">
                    <!-- Theme Switcher -->
                    <button id="btn-toggle-theme" class="btn-icon" title="Toggle Theme">🌙</button>

                    <!-- Mobile Tab Switcher -->
                    <div class="mobile-toggle-group">
                        <button id="btn-show-edit" class="btn-toggle active">Edit</button>
                        <button id="btn-show-preview" class="btn-toggle">Preview</button>
                    </div>

                    <span id="save-status" class="save-status">Saved ✓</span>

                    <button id="btn-full-preview" class="btn btn-secondary" title="Full Screen Preview (Ctrl+Shift+P)">
                        ⛶ Full Preview
                    </button>
                </div>
            </header>

            <!-- HTML Formatting Toolbar -->
            <div class="html-toolbar" id="html-toolbar">
                <!-- Text Styling -->
                <div class="toolbar-group">
                    <button data-action="bold" title="Bold (&lt;b&gt;)"><b>&lt;b&gt;</b></button>
                    <button data-action="italic" title="Italic (&lt;i&gt;)"><i>&lt;i&gt;</i></button>
                    <button data-action="underline" title="Underline (&lt;u&gt;)"><u>&lt;u&gt;</u></button>
                    <button data-action="strikethrough" title="Strikethrough (&lt;s&gt;)"><s>&lt;s&gt;</s></button>
                    <button data-action="code" title="Inline Code (&lt;code&gt;)">&lt;code&gt;</button>
                    <button data-action="mark" title="Highlight (&lt;mark&gt;)">&lt;mark&gt;</button>
                </div>

                <!-- Headings Dropdown -->
                <div class="toolbar-group">
                    <select id="heading-select" title="Insert Heading">
                        <option value="" disabled selected>Heading</option>
                        <option value="h1">&lt;h1&gt;</option>
                        <option value="h2">&lt;h2&gt;</option>
                        <option value="h3">&lt;h3&gt;</option>
                        <option value="h4">&lt;h4&gt;</option>
                        <option value="h5">&lt;h5&gt;</option>
                        <option value="h6">&lt;h6&gt;</option>
                    </select>
                </div>

                <!-- Structure & Layout -->
                <div class="toolbar-group">
                    <button data-action="p" title="Paragraph (&lt;p&gt;)">&lt;p&gt;</button>
                    <button data-action="div" title="Division (&lt;div&gt;)">&lt;div&gt;</button>
                    <button data-action="span" title="Span (&lt;span&gt;)">&lt;span&gt;</button>
                    <button data-action="blockquote" title="Blockquote (&lt;blockquote&gt;)">&lt;quote&gt;</button>
                </div>

                <!-- Lists -->
                <div class="toolbar-group">
                    <button data-action="ul" title="Unordered List (&lt;ul&gt;)">&lt;ul&gt;</button>
                    <button data-action="ol" title="Ordered List (&lt;ol&gt;)">&lt;ol&gt;</button>
                    <button data-action="li" title="List Item (&lt;li&gt;)">&lt;li&gt;</button>
                </div>

                <!-- Interactive & Media -->
                <div class="toolbar-group">
                    <button data-action="link" title="Insert Link (&lt;a&gt;)">🔗 &lt;a&gt;</button>
                    <button data-action="image" title="Insert Image (&lt;img&gt;)">🖼 &lt;img&gt;</button>
                    <button data-action="button" title="Insert Button (&lt;button&gt;)">&lt;btn&gt;</button>
                    <button data-action="table" title="Insert Table (&lt;table&gt;)">📊 &lt;table&gt;</button>
                    <button data-action="hr" title="Horizontal Rule (&lt;hr&gt;)">&lt;hr&gt;</button>
                    <button data-action="br" title="Line Break (&lt;br&gt;)">&lt;br&gt;</button>
                </div>

                <!-- History -->
                <div class="toolbar-group">
                    <button data-action="undo" title="Undo (Ctrl+Z)">↶</button>
                    <button data-action="redo" title="Redo (Ctrl+Y)">↷</button>
                </div>
            </div>

            <!-- Split Editor Container -->
            <div class="editor-container" id="editor-container">
                <!-- Source Code Area -->
                <div class="panel source-panel" id="source-panel">
                    <textarea id="html-input" placeholder="Type raw HTML here..." spellcheck="false"></textarea>
                </div>

                <!-- Live HTML Preview Panel -->
                <div class="panel preview-panel" id="preview-panel">
                    <div id="html-preview" class="html-body"></div>
                </div>
            </div>

            <!-- Status Bar -->
            <footer class="editor-footer">
                <div class="footer-stats">
                    <span>Words: <strong id="stat-words">0</strong></span>
                    <span>Characters: <strong id="stat-chars">0</strong></span>
                    <span>Lines: <strong id="stat-lines">0</strong></span>
                </div>
                <div class="footer-meta">
                    <span id="stat-modified">Last updated: -</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Fullscreen Reader Overlay -->
    <div id="full-preview-modal" class="modal-overlay hidden">
        <div class="full-preview-header">
            <button id="btn-close-full-preview" class="btn btn-secondary">← Back to Editor</button>
            <span class="full-preview-title">Full Screen Preview</span>
            <span></span>
        </div>
        <div class="full-preview-content">
            <div id="full-html-preview" class="html-body"></div>
        </div>
    </div>

    <!-- Dialog: Insert Link -->
    <div id="dialog-link" class="modal-dialog hidden">
        <div class="dialog-content">
            <h3>Insert Hyperlink</h3>
            <label>Link Text</label>
            <input type="text" id="link-text-input" placeholder="e.g. Visit Website">
            <label>Target URL</label>
            <input type="url" id="link-url-input" placeholder="https://example.com">
            <div class="dialog-actions">
                <button id="btn-cancel-link" class="btn btn-secondary">Cancel</button>
                <button id="btn-confirm-link" class="btn btn-primary">Insert Link</button>
            </div>
        </div>
    </div>

    <!-- Dialog: Insert Image -->
    <div id="dialog-image" class="modal-dialog hidden">
        <div class="dialog-content">
            <h3>Insert Image Tag</h3>
            <label>Alt Description</label>
            <input type="text" id="image-alt-input" placeholder="e.g. Logo image">
            <label>Image Source (URL)</label>
            <input type="url" id="image-url-input" placeholder="https://example.com/image.png">

            <div class="file-picker-section">
                <span class="divider-text">OR choose local file</span>
                <input type="file" id="image-file-input" accept="image/*">
            </div>

            <div class="dialog-actions">
                <button id="btn-cancel-image" class="btn btn-secondary">Cancel</button>
                <button id="btn-confirm-image" class="btn btn-primary">Insert Image</button>
            </div>
        </div>
    </div>
     
    <!-- Script -->
      <!-- <script src="editor.js"></script> -->
    <script src="script.js"></script>

</body>

</html>
