<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Details - NextCodeLab</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
    <link rel="apple-touch-icon" href="/assets/icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "6bbc1a3ecb334735a4137f1bf50463a0"}'>
    </script>
    <!-- End Cloudflare Web Analytics -->
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/" class="brand">NextCodeLab</a>

            <div class="nav-links">
                <a href="/#apps">Apps</a>
                <a href="/about/">About</a>

                <button id="theme-toggle" class="btn-secondary btn" style="padding: 0.4rem 0.8rem;"
                    aria-label="Toggle dark mode">
                    🌙
                </button>
            </div>
        </div>
    </nav>

    <main class="container" id="app-detail-container">
        <header class="app-detail-header">
            <img src="" id="app-icon" alt="App Icon" class="app-detail-icon">
            <div class="app-detail-info">
                <h1 id="app-title"></h1>
                <p class="app-detail-tagline" id="app-tagline"></p>
                <!-- JS injects store buttons here -->
                <div class="store-buttons-container" id="store-buttons"></div>
            </div>
        </header>

        <div class="app-detail-body">
            <div class="app-content-left">
                <h2>Screenshots</h2>
                <!-- JS injects images here -->
                <div class="screenshots-gallery" id="app-screenshots"></div>

                <h2 style="margin-top: 3rem;">About the App</h2>
                <p id="app-desc" style="color: var(--text-muted);"></p>

                <h3 style="margin-top: 2rem;">Features</h3>
                <!-- JS injects lists here -->
                <ul id="app-features" class="feature-list"></ul>
            </div>

            <aside class="app-sidebar">
                <h3>Information</h3>
                <div class="sidebar-info">
                    <span class="label">Category</span>
                    <strong id="app-category"></strong>

                    <span class="label">Platforms</span>
                    <strong id="app-platforms"></strong>
                </div>
            </aside>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer-content">

            <!-- Brand -->
            <div class="footer-column footer-brand">

                <a href="/" class="footer-logo">

                    <img src="/assets/icon.svg" alt="NextCodeLab" loading="lazy">

                    <span>
                        <strong data-site-name></strong>
                        <small data-company-tagline></small>
                    </span>

                </a>

                <p data-company-description></p>

            </div>


            <!-- Contact -->
            <div class="footer-column">

                <h3>Contact</h3>

                <ul class="footer-links">

                    <li>
                        <a data-contact-email href="#">
                            <i class="fa fa-envelope"></i>
                            Contact Us
                        </a>
                    </li>

                    <li>
                        <a data-site-website href="#">
                            <i class="fa fa-globe"></i>
                            Website
                        </a>
                    </li>

                </ul>

            </div>


            <!-- Legal -->
            <div class="footer-column">

                <h3>Legal</h3>

                <ul class="footer-links">

                    <li>
                        <a data-privacy-link href="/privacy/">
                            <i class="fa fa-shield"></i>
                            Privacy Policy
                        </a>
                    </li>

                    <li>
                        <a data-terms-link href="/terms/">
                            <i class="fa fa-file-text"></i>
                            Terms &amp; Conditions
                        </a>
                    </li>

                </ul>

            </div>


            <!-- About -->
            <div class="footer-column">

                <h3 data-footer-about-title>
                    About NextCodeLab
                </h3>

                <p data-footer-about></p>

            </div>

        </div>


        <!-- Copyright -->
        <div class="container footer-bottom">

            <p>
                &copy;
                <a href="/" class="footer-company-link">
                    <span data-copyright></span>
                    <strong data-site-name></strong>
                </a>.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Scroll to top -->
    <button id="scroll-top" class="scroll-top" aria-label="Scroll to top">

        <i class="fa fa-angle-up"></i>

    </button>
    <script src="/site-config.js"></script>
    <script src="/js/data.js"></script>
    <script src="/js/legal.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
